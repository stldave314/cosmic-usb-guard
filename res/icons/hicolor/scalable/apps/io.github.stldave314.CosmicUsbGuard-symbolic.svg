<!-- Symbolic icon: a solid shield with the USB trident cut out of it. A
     cut-out keeps the trident's strokes a full pixel wide at 16px, which an
     outlined shield leaves no room for. One even-odd path, so it needs
     nothing beyond basic path support from whatever renders it. -->
